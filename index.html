html, body {

}
.lang-options {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 16px;

width: 100%;
}
.lang-btn {
position: relative;
display: flex;
flex-direction: column;
align-items: center;
padding: 14px 10px;
border: 1px solid rgba(96, 165, 250, 0.3);
border-radius: 16px;

cursor: pointer;
transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

overflow: hidden;
}
.lang-btn::before {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 60%;
height: 100%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
transition: left 0.5s ease;
}
.lang-btn:hover::before {
left: 150%;
}
.lang-btn:hover {
border-color: var(--gc-light-blue);
background: rgba(30, 58, 138, 0.75);
transform: translateY(-4px) scale(1.02);

font-size: clamp(0.8rem, 2.5vw, 0.95rem);
font-weight: 600;
color: #e2e8f0;
letter-spacing: 0.5px;
}

display: none;
flex-direction: column;
align-items: center;
justify-content: space-between;
width: 100%;
height: 100%;

font-size: clamp(1.2rem, 3.5vw, 1.8rem);
text-transform: uppercase;
letter-spacing: 3px;
text-align: center;
margin-top: 5px;

/* --- TABLERO DINÁMICO --- */

display: grid;
grid-template-columns: repeat(4, 1fr);
grid-template-rows: repeat(4, 1fr);
gap: clamp(8px, 1.5vw, 14px);
width: min(85vw, 52vh);
height: min(85vw, 52vh);
perspective: 1000px;
margin: auto 0;
}
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
cursor: pointer;
border-radius: 12px;
}
.card:hover {
box-shadow: 0 0 15px var(--glow-red);
}
.card.flip {
transform: rotateY(180deg);
}
.card-face {
position: absolute;
width: 100%;
height: 100%;
border-radius: 12px;
backface-visibility: hidden;
-webkit-backface-visibility: hidden;
display: flex;
justify-content: center;
align-items: center;
box-shadow: 0 6px 12px rgba(0,0,0,0.5);
overflow: hidden;
border: 1px solid rgba(96, 165, 250, 0.3);
}
.card-back {
background-color: var(--gc-dark-bg);

width: 100%;
height: 100%;
object-fit: cover;
}
.card-front {

padding: 6px;
}

max-width: 100%;

}

/* --- SISTEMA DE SONIDOS CON WEB AUDIO API --- */
let audioCtx = null;
function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
}
function playFlipSound() {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(400, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.08);
}
function playMatchSound() {
if (!audioCtx) return;
const now = audioCtx.currentTime;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(523.25, now);
osc.frequency.setValueAtTime(659.25, now + 0.1);
gain.gain.setValueAtTime(0.2, now);
gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start(now);
osc.stop(now + 0.3);
}
function playMismatchSound() {
if (!audioCtx) return;
const now = audioCtx.currentTime;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(180, now);
osc.frequency.linearRampToValueAtTime(130, now + 0.2);
gain.gain.setValueAtTime(0.15, now);
gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start(now);
osc.stop(now + 0.2);
}
function playWinSound() {
if (!audioCtx) return;
const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
const now = audioCtx.currentTime;
notes.forEach((freq, idx) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.2, now + idx * 0.1);
gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start(now + idx * 0.1);
osc.stop(now + idx * 0.1 + 0.3);
});
}

let gamePhase = 1; // 1 = Normal, 2 = Memorización (20s), 3 = Modo sin fallos
let countdownTimer = null;

function shuffle(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

function selectLanguage(lang) {
initAudio();
currentLang = lang;
document.getElementById('language-selector').style.display = 'none';

// Configurar textos del modal de contraseña
document.getElementById('pass-title').innerText = translations[lang].passTitle;
document.getElementById('pass-desc').innerText = translations[lang].passDesc;
document.getElementById('pass-btn').innerText = translations[lang].passBtn;
document.getElementById('pass-error').innerText = translations[lang].passErr;

// Mostrar modal de contraseña
document.getElementById('password-modal').style.display = 'flex';
document.getElementById('pass-input').focus();
}

function checkPassInput() {
document.getElementById('pass-error').style.display = 'none';
}

function validatePassword() {
const input = document.getElementById('pass-input').value.trim().toUpperCase();
if (input === 'TORRATE') {
document.getElementById('password-modal').style.display = 'none';

// Mostrar modal de reglas
document.getElementById('rules-title').innerText = translations[currentLang].rulesTitle;
document.getElementById('rules-text').innerHTML = translations[currentLang].rulesText;
document.getElementById('start-btn').innerText = translations[currentLang].startBtn;
document.getElementById('rules-modal').style.display = 'flex';
} else {
document.getElementById('pass-error').style.display = 'block';
}
}

// Permitir presionar Enter en la contraseña
document.getElementById('pass-input').addEventListener('keypress', function(e) {
if (e.key === 'Enter') {
validatePassword();
}
});

function startMemoryPhase() {
document.getElementById('rules-modal').style.display = 'none';
document.getElementById('game-container').style.display = 'flex';

document.getElementById('game-title').innerText = translations[currentLang].title;
document.getElementById('modal-congrats').innerText = translations[currentLang].congrats;
document.getElementById('modal-message').innerText = translations[currentLang].msg;
document.getElementById('copy-button').innerText = translations[currentLang].copy;
document.getElementById('certitude-link').innerText = translations[currentLang].cert;

setupBoard();
}

function createImageElement(src, altName) {
const img = document.createElement('img');
img.src = src;
img.alt = altName;
img.onerror = function() {
if (img.src.includes('./')) {
img.src = src.replace('./', '');
} else {
const fallback = document.createElement('div');
fallback.className = 'img-fallback';
fallback.innerText = altName.replace(/\.(png|jpg|jpeg)/i, '');
if (img.parentNode) {
img.parentNode.replaceChild(fallback, img);
}
}
};
return img;
}

function setupBoard() {
gamePhase = 1;
matchedPairs = 0;
resetBoard();

const gameBoard = document.getElementById('game-board');
gameBoard.innerHTML = '';
const shuffledCards = shuffle(cardData);

shuffledCards.forEach(imgSrc => {
const card = document.createElement('div');
card.classList.add('card');
card.dataset.image = imgSrc;

// Cara Trasera (Reverso)
const cardBack = document.createElement('div');
cardBack.classList.add('card-face', 'card-back');
const backImg = createImageElement('./' + backImage, backImage);
cardBack.appendChild(backImg);

// Cara Delantera (Anverso)
const cardFront = document.createElement('div');
cardFront.classList.add('card-face', 'card-front');
const frontImg = createImageElement('./' + imgSrc, imgSrc);
cardFront.appendChild(frontImg);

card.appendChild(cardBack);
card.appendChild(cardFront);

card.addEventListener('click', flipCard);
gameBoard.appendChild(card);
});
}

function flipCard() {
if (lockBoard) return;
if (this === firstCard) return;
if (this.classList.contains('flip')) return;

playFlipSound();
this.classList.add('flip');

if (!hasFlippedCard) {
hasFlippedCard = true;
firstCard = this;
return;
}

secondCard = this;
checkForMatch();
}

function checkForMatch() {
let isMatch = firstCard.dataset.image === secondCard.dataset.image;

if (gamePhase === 1) {
// FASE 1: Juego normal
isMatch ? disableCards() : unflipCards();
} else if (gamePhase === 3) {
// FASE 3: Modo Sin Fallos
if (isMatch) {
playMatchSound();
matchedPairs++;
resetBoard();
if (matchedPairs === frontImages.length) {
setTimeout(() => {
playWinSound();
document.getElementById('end-modal').style.display = 'flex';
}, 500);
}
} else {
// Si falla en Fase 3: Reiniciar esta fase
lockBoard = true;
playMismatchSound();
setTimeout(() => {
resetPhase3();
}, 1000);
}
}
}

function disableCards() {
playMatchSound();
firstCard.removeEventListener('click', flipCard);
secondCard.removeEventListener('click', flipCard);
matchedPairs++;
resetBoard();

// Si completa la Fase 1 -> Pasar a Fase 2 (Memorización)
if (matchedPairs === frontImages.length) {
setTimeout(startPhase2, 600);
}
}

function unflipCards() {
lockBoard = true;
playMismatchSound();
setTimeout(() => {
firstCard.classList.remove('flip');
secondCard.classList.remove('flip');
resetBoard();
}, 900);
}

function resetBoard() {
[hasFlippedCard, lockBoard] = [false, false];
[firstCard, secondCard] = [null, null];
}

/* --- FASE 2: MEMORIZACIÓN (20 SEGUNDOS) --- */
function startPhase2() {
gamePhase = 2;
lockBoard = true;

const timerContainer = document.getElementById('timer-container');
const timerLabel = document.getElementById('timer-label');
const timerCount = document.getElementById('timer-count');

timerLabel.innerText = translations[currentLang].timerText;
let timeLeft = 20;
timerCount.innerText = timeLeft;
timerContainer.style.display = 'block';

countdownTimer = setInterval(() => {
timeLeft--;
timerCount.innerText = timeLeft;
if (timeLeft <= 0) {
clearInterval(countdownTimer);
timerContainer.style.display = 'none';
startPhase3();
}
}, 1000);
}

/* --- FASE 3: MODO SIN FALLOS --- */
function startPhase3() {
gamePhase = 3;
matchedPairs = 0;

// Dar la vuelta a todas las cartas
const cards = document.querySelectorAll('.card');
cards.forEach(card => {
card.classList.remove('flip');
card.addEventListener('click', flipCard);
});

resetBoard();
}

function resetPhase3() {
matchedPairs = 0;
const cards = document.querySelectorAll('.card');
cards.forEach(card => {
card.classList.remove('flip');
});
resetBoard();
}

function copyCode() {
playFlipSound();
const codeText = document.getElementById('final-code').innerText;
const btn = document.getElementById('copy-button');
navigator.clipboard.writeText(codeText).then(() => {
btn.innerText = translations[currentLang].copied;
btn.style.backgroundColor = 'var(--gc-light-blue)';
setTimeout(() => {
btn.innerText = translations[currentLang].copy;
btn.style.backgroundColor = 'var(--gc-red)';
}, 2000);
});
}
</script>
